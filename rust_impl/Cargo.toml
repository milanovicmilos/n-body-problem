[package]
name = "nbody-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nbody-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"
rand = "0.8"
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
num_cpus = "1.16"
glob = "0.3"
plotters = "0.3"
plotters-svg = "0.3"

[[bin]]
name = "nbody-viz"
path = "src/bin/viz.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
