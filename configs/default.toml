# Default configuration for N-body simulation

[simulation]
n = 1000                    # Number of bodies
steps = 5000               # Number of simulation steps
dt = 0.001                 # Time step size
eps = 0.01                 # Softening parameter
G = 1.0                    # Gravitational constant
seed = 42                  # Random seed for reproducibility

[output]
dump_every = 100           # Save state every N steps
output_dir = "data/outputs/default"

[physics]
integrator = "verlet"      # Integration method (verlet, rk4, euler)
algorithm = "naive"        # Force calculation algorithm (naive, barnes_hut)

[parallel]
processes = 4              # Number of processes for multiprocessing
